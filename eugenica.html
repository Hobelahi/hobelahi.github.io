<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eugenica - Story & Characters</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #494d5f;
      color: #e5eaf5;
      line-height: 1.6;
      min-height: 100vh;
    }
    .dna-gif-container {
      width: 100vw;
      overflow: hidden;
      position: relative;
      left: 50%;
      right: 50%;
      margin-left: -50vw;
      margin-right: -50vw;
    }
    .dna-gif-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    header {
      padding: 20px;
      text-align: center;
      background-color: #3b3f55;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    header h1 {
      font-size: 3rem;
      color: #a0d2eb;
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
      color: #e5eaf5;
    }
  </style>
</head>
<body>

  <nav>
    <!-- منوی سایت -->
  </nav>

  <div class="dna-gif-container">
    <img src="images/Dna.GIF" alt="Spinning DNA Spiral" />
  </div>

  <header>
    <h1>Eugenica</h1>
    <p>A sci-fi, crime, horror, and fantasy story blending dark mysteries and vivid imagination.</p>
  </header>

</body>
</html>
